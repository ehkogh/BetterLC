name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9] ]] || version=0.0.0
          dotnet publish -c Release -r ${{ matrix.rid }} -o publish -p:Version="$version"
          mkdir dist

      - name: Smoke test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          ./publish/BetterLC${{ startsWith(matrix.rid, 'win') && '.exe' || '' }} versions-json > versions.json
          python3 -c "import json; v = json.load(open('versions.json')); assert v, 'no versions'; print(len(v), 'versions')"

      - name: Package for Windows
        if: startsWith(matrix.rid, 'win')
        shell: bash
        run: cp publish/BetterLC.exe dist/BetterLC.exe

      - name: Package for macOS
        if: startsWith(matrix.rid, 'osx')
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9] ]] || version=0.0.0
          app=dist/BetterLC.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp publish/BetterLC "$app/Contents/MacOS/BetterLC"
          for size in 16 32 128 256; do
            sips -z $size $size Assets/logo.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) Assets/logo.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/BetterLC.icns"
          sed "s/{{VERSION}}/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          (cd dist && ditto -c -k --keepParent BetterLC.app "BetterLC-macos-${{ matrix.rid == 'osx-arm64' && 'apple-silicon' || 'intel' }}.zip")
          rm -rf "$app"

      - name: Package for Linux
        if: startsWith(matrix.rid, 'linux')
        run: |
          chmod +x publish/BetterLC
          tar -czf dist/BetterLC-linux-x64.tar.gz -C publish BetterLC

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "BetterLC $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
