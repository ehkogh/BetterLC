name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9] ]] || version=0.0.0
          echo "VERSION=$version" >> "$GITHUB_ENV"
          dotnet publish -c Release -r ${{ matrix.rid }} -o publish -p:Version="$version"
          mkdir dist portable
          echo 'BetterLC keeps its data in the "BetterLC Data" folder next to it while this file exists.' > portable/portable

      - name: Smoke test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          ./publish/BetterLC${{ startsWith(matrix.rid, 'win') && '.exe' || '' }} versions-json > versions.json
          python3 -c "import json; v = json.load(open('versions.json')); assert v, 'no versions'; print(len(v), 'versions')"

      - name: Package for Windows
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" packaging\windows\BetterLC.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory staging\BetterLC | Out-Null
          Copy-Item publish\BetterLC.exe, portable\portable staging\BetterLC
          Compress-Archive staging\BetterLC dist\BetterLC-windows-portable.zip

      - name: Package for macOS
        if: startsWith(matrix.rid, 'osx')
        run: |
          name=BetterLC-macos-${{ matrix.rid == 'osx-arm64' && 'apple-silicon' || 'intel' }}
          app=build/BetterLC.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp publish/BetterLC "$app/Contents/MacOS/BetterLC"
          for size in 16 32 128 256; do
            sips -z $size $size Assets/logo.png --out icon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) Assets/logo.png --out icon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/BetterLC.icns"
          sed "s/{{VERSION}}/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"

          mkdir -p staging/portable/BetterLC staging/dmg
          cp -R "$app" staging/portable/BetterLC/
          cp portable/portable staging/portable/BetterLC/BetterLC.app/Contents/Resources/portable
          codesign --force --deep --sign - staging/portable/BetterLC/BetterLC.app
          (cd staging/portable && ditto -c -k --keepParent BetterLC "../../dist/$name-portable.zip")

          cp -R "$app" staging/dmg/
          codesign --force --deep --sign - staging/dmg/BetterLC.app
          ln -s /Applications staging/dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname BetterLC -srcfolder staging/dmg -ov -format UDZO "dist/$name.dmg" && break
            sleep 5
          done
          test -f "dist/$name.dmg"

      - name: Package for Linux
        if: startsWith(matrix.rid, 'linux')
        run: |
          chmod +x publish/BetterLC
          mkdir -p staging/BetterLC
          cp publish/BetterLC portable/portable staging/BetterLC/
          tar -czf dist/BetterLC-linux-x64-portable.tar.gz -C staging BetterLC

          root=deb
          install -Dm755 publish/BetterLC "$root/opt/betterlc/BetterLC"
          install -Dm644 packaging/linux/betterlc.desktop "$root/usr/share/applications/betterlc.desktop"
          install -Dm644 Assets/logo.png "$root/usr/share/icons/hicolor/256x256/apps/betterlc.png"
          mkdir -p "$root/usr/bin" "$root/DEBIAN"
          ln -s /opt/betterlc/BetterLC "$root/usr/bin/betterlc"
          sed "s/{{VERSION}}/$VERSION/g" packaging/linux/control > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" dist/BetterLC-linux-x64.deb
          dpkg-deb --info dist/BetterLC-linux-x64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "BetterLC $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
