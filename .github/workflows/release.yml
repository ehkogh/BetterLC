name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish -c Release -o release -p:Version=$version

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/BetterLC.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BetterLC.exe" | Out-File -Encoding ascii -NoNewline release/BetterLC.exe.sha256

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $arguments = @($tag, "release/BetterLC.exe", "release/BetterLC.exe.sha256", "--title", "BetterLC $tag", "--generate-notes")
          if ($tag -match "-") { $arguments += "--prerelease" }
          gh release create @arguments
